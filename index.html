<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Studio & PWA Launcher</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Font: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Pre-declared static hooks for iOS Safari and Chrome Home Screen Icon detection -->
  <link rel="apple-touch-icon" id="appleTouchIcon" href="">
  <link rel="apple-touch-icon" id="appleTouchIcon180" sizes="180x180" href="">
  <link rel="apple-touch-icon" id="appleTouchIcon152" sizes="152x152" href="">
  <link rel="apple-touch-icon-precomposed" id="appleTouchIconPre" href="">
  <link rel="icon" id="dynamicFavicon" href="">
  <link rel="manifest" id="dynamicManifestLink">
  <meta name="theme-color" id="dynamicThemeColor" content="#0f172a">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <script>
    /* Base64 UTF-8 Helpers to preserve app payload across isolated home screen containers */
    function encodePayload(obj) {
      try {
        const str = JSON.stringify(obj);
        const bytes = new TextEncoder().encode(str);
        let bin = '';
        for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin);
      } catch (e) {
        return '';
      }
    }

    function decodePayload(b64) {
      try {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const str = new TextDecoder().decode(bytes);
        return JSON.parse(str);
      } catch (e) {
        return null;
      }
    }

    /*
     * DYNAMIC PWA & ROUTING LOGIC:
     * Check if URL has '?app=<id>'.
     * Checks localStorage, with automatic fallback & restore from the encoded URL parameter.
     */
    (function checkChildRoute() {
      const urlParams = new URLSearchParams(window.location.search);
      const activeAppId = urlParams.get('app');

      if (!activeAppId) return; // Stay in Parent Studio mode

      try {
        const rawData = localStorage.getItem('parent_studio_apps');
        let apps = rawData ? JSON.parse(rawData) : {};
        let childApp = apps[activeAppId];

        // Fallback: If opened inside standalone home screen container where localStorage is isolated,
        // restore directly from the encoded payload in the query or hash.
        if (!childApp) {
          const dParam = urlParams.get('d');
          if (dParam) {
            childApp = decodePayload(dParam);
          } else if (window.location.hash && window.location.hash.includes('data=')) {
            childApp = decodePayload(window.location.hash.split('data=')[1]);
          }

          // If recovered, persist into the home screen app's isolated storage
          if (childApp && childApp.id) {
            apps[childApp.id] = childApp;
            localStorage.setItem('parent_studio_apps', JSON.stringify(apps));
          }
        }

        if (!childApp) {
          window.addEventListener('DOMContentLoaded', () => {
            document.body.innerHTML = `
              <div class="min-h-screen bg-slate-50 text-slate-800 flex flex-col items-center justify-center p-6 text-center font-sans">
                <div class="bg-white border border-slate-200 p-8 rounded-2xl max-w-md shadow-sm">
                  <div class="w-12 h-12 bg-red-50 text-red-500 rounded-xl flex items-center justify-center text-xl mx-auto mb-3">⚠️</div>
                  <h1 class="text-lg font-bold text-slate-900 mb-1">App Not Found</h1>
                  <p class="text-slate-500 text-sm mb-5">Could not find "<strong>${activeAppId}</strong>" in this container.</p>
                  <a href="${window.location.pathname}" class="inline-block px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium transition-colors">Return to Studio</a>
                </div>
              </div>
            `;
          });
          return;
        }

        // 1. Set document Title
        document.title = childApp.title || "Child App";

        const appBgColor = childApp.themeColor || '#0f172a';

        // 2. Resolve Hosted Image Icon or SVG fallback
        const appEmoji = childApp.emoji || '⚡';
        const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="${appBgColor}"/><text y=".9em" x="50%" text-anchor="middle" font-size="70">${appEmoji}</text></svg>`;
        const fallbackIcon = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svgIcon)}`;
        const effectiveIcon = (childApp.iconUrl && childApp.iconUrl.trim()) ? childApp.iconUrl.trim() : fallbackIcon;

        // Preload icon into browser cache immediately for iOS Safari snapshotting
        const iconPreload = new Image();
        iconPreload.crossOrigin = "anonymous";
        iconPreload.src = effectiveIcon;

        const manifestObj = {
          name: childApp.title,
          short_name: (childApp.title || "App").substring(0, 12),
          description: `Installed via App Studio`,
          start_url: window.location.href,
          display: "standalone",
          orientation: "portrait-primary",
          background_color: appBgColor,
          theme_color: appBgColor,
          icons: [
            {
              src: effectiveIcon,
              sizes: "192x192",
              purpose: "any"
            },
            {
              src: effectiveIcon,
              sizes: "512x512",
              purpose: "any"
            },
            {
              src: effectiveIcon,
              sizes: "192x192",
              purpose: "maskable"
            },
            {
              src: effectiveIcon,
              sizes: "512x512",
              purpose: "maskable"
            }
          ]
        };

        // 4. Update the pre-declared Manifest Link via Blob URL
        const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
        const manifestUrl = URL.createObjectURL(manifestBlob);
        const manifestLink = document.getElementById('dynamicManifestLink');
        if (manifestLink) {
          manifestLink.href = manifestUrl;
        }

        // 5. Update pre-declared iOS Apple Touch Icons and Favicon
        const appleIcon = document.getElementById('appleTouchIcon');
        if (appleIcon) appleIcon.href = effectiveIcon;
        const appleIcon180 = document.getElementById('appleTouchIcon180');
        if (appleIcon180) appleIcon180.href = effectiveIcon;
        const appleIcon152 = document.getElementById('appleTouchIcon152');
        if (appleIcon152) appleIcon152.href = effectiveIcon;
        const appleIconPre = document.getElementById('appleTouchIconPre');
        if (appleIconPre) appleIconPre.href = effectiveIcon;
        const dynamicFavicon = document.getElementById('dynamicFavicon');
        if (dynamicFavicon) dynamicFavicon.href = effectiveIcon;

        const themeMeta = document.getElementById('dynamicThemeColor');
        if (themeMeta) themeMeta.content = appBgColor;

        const metaCapable = document.createElement('meta');
        metaCapable.name = "apple-mobile-web-app-capable";
        metaCapable.content = "yes";
        document.head.appendChild(metaCapable);

        const metaBar = document.createElement('meta');
        metaBar.name = "apple-mobile-web-app-status-bar-style";
        metaBar.content = "black-translucent";
        document.head.appendChild(metaBar);

        const metaTitle = document.createElement('meta');
        metaTitle.name = "apple-mobile-web-app-title";
        metaTitle.content = childApp.title;
        document.head.appendChild(metaTitle);

        window.addEventListener('DOMContentLoaded', () => {
          document.body.style.margin = "0";
          document.body.style.padding = "0";
          document.body.style.overflow = "hidden";
          document.body.style.width = "100vw";
          document.body.style.height = "100vh";
          document.body.style.background = appBgColor;

          const frame = document.createElement('iframe');
          frame.style.width = "100%";
          frame.style.height = "100%";
          frame.style.border = "none";
          frame.style.display = "block";
          frame.style.background = appBgColor;
          frame.setAttribute('allow', 'fullscreen; geolocation; microphone; camera; midi');
          frame.srcdoc = childApp.code;

          document.body.innerHTML = '';
          document.body.appendChild(frame);
        });

      } catch (err) {
        console.error("Router error:", err);
      }
    })();
  </script>

  <style>
    /* Clean custom scrollbar for light theme */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans selection:bg-indigo-100 selection:text-indigo-900 flex flex-col">

  <!-- Header -->
  <header class="border-b border-slate-200 bg-white sticky top-0 z-30">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-white text-base shadow-sm">
          ⚡
        </div>
        <div>
          <h1 class="text-sm sm:text-base font-semibold text-slate-900 flex items-center gap-2">
            App Studio
            <span class="text-[11px] font-mono font-medium bg-slate-100 text-slate-600 border border-slate-200 px-2 py-0.5 rounded-md">PWA Host</span>
          </h1>
        </div>
      </div>

      <button id="btnClearForm" class="px-3.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-xs sm:text-sm transition-all">
        Clear
      </button>
    </div>
  </header>

  <!-- Main Content Form -->
  <main class="max-w-3xl w-full mx-auto p-4 sm:p-6 flex-1 flex flex-col justify-start">
    <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
      
      <!-- Frontend Inputs: App Name, Hosted Image URL & Splash Color -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">App Name</label>
          <input type="text" id="inputTitle" placeholder="Enter app name" class="w-full bg-white border border-slate-300 focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 rounded-lg px-3 py-2 text-sm text-slate-900 placeholder-slate-400 outline-none transition-all">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Hosted Image URL</label>
          <div class="flex items-center gap-2">
            <input type="url" id="inputIconUrl" placeholder="https://example.com/icon.png" class="flex-1 bg-white border border-slate-300 focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 rounded-lg px-3 py-2 text-sm text-slate-900 placeholder-slate-400 outline-none transition-all">
            <div id="iconPreviewBox" class="w-9 h-9 rounded-lg border border-slate-200 bg-slate-100 flex items-center justify-center overflow-hidden shrink-0">
              <span id="iconPreviewPlaceholder" class="text-xs text-slate-400">🖼️</span>
              <img id="iconPreviewImg" src="" alt="Icon" class="w-full h-full object-cover hidden">
            </div>
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Splash / BG Color</label>
          <div class="flex items-center gap-2">
            <input type="color" id="inputColorPicker" value="#0f172a" class="w-9 h-9 p-0.5 rounded-lg border border-slate-300 bg-white cursor-pointer shrink-0">
            <input type="text" id="inputThemeColor" value="#0f172a" placeholder="#0f172a" class="w-full bg-white border border-slate-300 focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 rounded-lg px-3 py-2 text-sm text-slate-900 font-mono outline-none transition-all">
          </div>
        </div>
      </div>

      <!-- HTML Code Area -->
      <div class="mb-5">
        <label for="inputCode" class="block text-xs font-medium text-slate-700 mb-1">HTML / CSS / JS Code</label>
        <textarea id="inputCode" rows="15" placeholder="Paste full HTML code here..." class="w-full bg-slate-900 text-slate-100 border border-slate-800 rounded-lg p-3 text-xs sm:text-sm font-mono placeholder-slate-500 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none resize-y leading-relaxed transition-all"></textarea>
      </div>

      <!-- Action Button -->
      <div class="flex items-center justify-end pt-1">
        <button id="btnCreateApp" class="w-full sm:w-auto px-6 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-medium text-sm shadow-sm transition-all">
          Create
        </button>
      </div>
    </div>
  </main>

  <!-- Center Success Popup Modal -->
  <div id="modalOverlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white border border-slate-200 rounded-2xl p-6 max-w-sm w-full shadow-xl text-center flex flex-col items-center animate-in fade-in zoom-in-95 duration-150">
      <div id="modalIconContainer" class="w-16 h-16 rounded-2xl bg-indigo-50 border border-indigo-100 flex items-center justify-center overflow-hidden mb-4 shadow-sm">
        <img id="modalIconImg" src="" alt="App Icon" class="w-full h-full object-cover hidden">
        <span id="modalIconFallback" class="text-2xl">⚡</span>
      </div>
      <h3 id="modalAppTitle" class="text-lg font-bold text-slate-900 mb-1">App Ready</h3>
      <p class="text-xs text-slate-500 mb-6">Your app has been generated successfully.</p>
      
      <div class="flex flex-col w-full gap-2">
        <a id="btnModalOpen" target="_blank" href="#" class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm transition-all shadow-sm flex items-center justify-center gap-2">
          Open the App
        </a>
        <button id="btnModalClose" class="w-full py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-xs transition-all">
          Close
        </button>
      </div>
    </div>
  </div>

  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none bg-slate-900 text-white text-xs sm:text-sm px-4 py-2.5 rounded-lg shadow-lg flex items-center gap-2">
    <span id="toastIcon">✨</span>
    <span id="toastMsg">Operation successful</span>
  </div>

  <script>
    const STORAGE_KEY = 'parent_studio_apps';

    // DOM Elements
    const inputTitle = document.getElementById('inputTitle');
    const inputIconUrl = document.getElementById('inputIconUrl');
    const iconPreviewImg = document.getElementById('iconPreviewImg');
    const iconPreviewPlaceholder = document.getElementById('iconPreviewPlaceholder');
    const inputColorPicker = document.getElementById('inputColorPicker');
    const inputThemeColor = document.getElementById('inputThemeColor');
    const inputCode = document.getElementById('inputCode');
    const btnCreateApp = document.getElementById('btnCreateApp');
    const btnClearForm = document.getElementById('btnClearForm');

    // Modal Elements
    const modalOverlay = document.getElementById('modalOverlay');
    const modalAppTitle = document.getElementById('modalAppTitle');
    const modalIconImg = document.getElementById('modalIconImg');
    const modalIconFallback = document.getElementById('modalIconFallback');
    const btnModalOpen = document.getElementById('btnModalOpen');
    const btnModalClose = document.getElementById('btnModalClose');

    inputColorPicker.addEventListener('input', () => {
      inputThemeColor.value = inputColorPicker.value;
    });

    inputThemeColor.addEventListener('input', () => {
      const val = inputThemeColor.value.trim();
      if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
        inputColorPicker.value = val;
      }
    });

    // Live update icon preview
    inputIconUrl.addEventListener('input', () => {
      const url = inputIconUrl.value.trim();
      if (url) {
        iconPreviewImg.src = url;
        iconPreviewImg.onload = () => {
          iconPreviewImg.classList.remove('hidden');
          iconPreviewPlaceholder.classList.add('hidden');
        };
        iconPreviewImg.onerror = () => {
          iconPreviewImg.classList.add('hidden');
          iconPreviewPlaceholder.classList.remove('hidden');
        };
      } else {
        iconPreviewImg.src = '';
        iconPreviewImg.classList.add('hidden');
        iconPreviewPlaceholder.classList.remove('hidden');
      }
    });

    // Toast Messenger
    function showToast(message, icon = '✨') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');
      toastMsg.innerText = message;
      toastIcon.innerText = icon;
      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 2400);
    }

    btnClearForm.addEventListener('click', () => {
      inputTitle.value = '';
      inputIconUrl.value = '';
      iconPreviewImg.src = '';
      iconPreviewImg.classList.add('hidden');
      iconPreviewPlaceholder.classList.remove('hidden');
      inputThemeColor.value = '#0f172a';
      inputColorPicker.value = '#0f172a';
      inputCode.value = '';
      inputTitle.focus();
    });

    // Close Modal
    btnModalClose.addEventListener('click', () => {
      modalOverlay.classList.add('hidden');
    });

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) {
        modalOverlay.classList.add('hidden');
      }
    });

    btnCreateApp.addEventListener('click', () => {
      const title = inputTitle.value.trim();
      const rawIconUrl = inputIconUrl.value.trim();
      const themeColor = inputThemeColor.value.trim() || '#0f172a';
      const code = inputCode.value;

      if (!title) {
        showToast('Please enter an App Name', '⚠️');
        inputTitle.focus();
        return;
      }

      if (!code.trim()) {
        showToast('Code cannot be empty', '⚠️');
        inputCode.focus();
        return;
      }

      // Automatically generate backend slug ID and fallback emoji
      const id = title.toLowerCase().replace(/[^a-z0-9_-]/g, '-').replace(/-+/g, '-') || 'app-' + Date.now();
      const emoji = '⚡';

      const finalizeSave = (iconToUse) => {
        const appData = { id, title, iconUrl: iconToUse, emoji, themeColor, code, updatedAt: Date.now() };

        // Save to localStorage
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          const apps = stored ? JSON.parse(stored) : {};
          apps[id] = appData;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(apps));
        } catch (e) {
          console.error("Storage error:", e);
        }

        // Generate self-sustaining URL
        const encoded = encodePayload(appData);
        const directUrl = `${window.location.origin}${window.location.pathname}?app=${encodeURIComponent(id)}&d=${encodeURIComponent(encoded)}`;

        // Update Center Popup
        modalAppTitle.innerText = title;
        btnModalOpen.href = directUrl;

        if (iconToUse) {
          modalIconImg.src = iconToUse;
          modalIconImg.classList.remove('hidden');
          modalIconFallback.classList.add('hidden');
        } else {
          modalIconImg.classList.add('hidden');
          modalIconFallback.classList.remove('hidden');
        }

        // Open Center Popup
        modalOverlay.classList.remove('hidden');
      };

      // If user provided an icon URL, convert to local PNG Data URI if CORS allows, otherwise use raw URL
      if (rawIconUrl) {
        const testImg = new Image();
        testImg.crossOrigin = 'anonymous';
        testImg.onload = () => {
          try {
            const canvas = document.createElement('canvas');
            canvas.width = 192;
            canvas.height = 192;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(testImg, 0, 0, 192, 192);
            const dataUri = canvas.toDataURL('image/png');
            finalizeSave(dataUri);
          } catch (err) {
            finalizeSave(rawIconUrl);
          }
        };
        testImg.onerror = () => {
          finalizeSave(rawIconUrl);
        };
        testImg.src = rawIconUrl;
      } else {
        finalizeSave('');
      }
    });
  </script>
</body>
</html>
