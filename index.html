  <script>
    /*
     * Compact, URL-Safe LZ Compressor & Decompressor
     * Enables complete offline self-hydration across isolated Home Screen containers
     * without triggering GitHub Pages 414 Request URI limits.
     */
    const LZ = {
      _k: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+-$",
      compress: function(uncompressed) {
        if (!uncompressed) return "";
        let i, value,
            context_dictionary = {},
            context_dictionaryToCreate = {},
            context_c = "",
            context_wc = "",
            context_w = "",
            context_enlargeIn = 2,
            context_dictSize = 3,
            context_numBits = 2,
            context_data = [],
            context_data_val = 0,
            context_data_position = 0,
            ii;

        for (ii = 0; ii < uncompressed.length; ii += 1) {
          context_c = uncompressed.charAt(ii);
          if (!Object.prototype.hasOwnProperty.call(context_dictionary, context_c)) {
            context_dictionary[context_c] = context_dictSize++;
            context_dictionaryToCreate[context_c] = true;
          }
          context_wc = context_w + context_c;
          if (Object.prototype.hasOwnProperty.call(context_dictionary, context_wc)) {
            context_w = context_wc;
          } else {
            if (Object.prototype.hasOwnProperty.call(context_dictionaryToCreate, context_w)) {
              if (context_w.charCodeAt(0) < 256) {
                for (i = 0; i < context_numBits; i++) {
                  context_data_val = (context_data_val << 1);
                  if (context_data_position == 5) {
                    context_data_position = 0;
                    context_data.push(LZ._k.charAt(context_data_val));
                    context_data_val = 0;
                  } else {
                    context_data_position++;
                  }
                }
                value = context_w.charCodeAt(0);
                for (i = 0; i < 8; i++) {
                  context_data_val = (context_data_val << 1) | (value & 1);
                  if (context_data_position == 5) {
                    context_data_position = 0;
                    context_data.push(LZ._k.charAt(context_data_val));
                    context_data_val = 0;
                  } else {
                    context_data_position++;
                  }
                  value = value >> 1;
                }
              } else {
                value = 1;
                for (i = 0; i < context_numBits; i++) {
                  context_data_val = (context_data_val << 1) | value;
                  if (context_data_position == 5) {
                    context_data_position = 0;
                    context_data.push(LZ._k.charAt(context_data_val));
                    context_data_val = 0;
                  } else {
                    context_data_position++;
                  }
                  value = 0;
                }
                value = context_w.charCodeAt(0);
                for (i = 0; i < 16; i++) {
                  context_data_val = (context_data_val << 1) | (value & 1);
                  if (context_data_position == 5) {
                    context_data_position = 0;
                    context_data.push(LZ._k.charAt(context_data_val));
                    context_data_val = 0;
                  } else {
                    context_data_position++;
                  }
                  value = value >> 1;
                }
              }
              context_enlargeIn--;
              if (context_enlargeIn == 0) {
                context_enlargeIn = Math.pow(2, context_numBits);
                context_numBits++;
              }
              delete context_dictionaryToCreate[context_w];
            } else {
              value = context_dictionary[context_w];
              for (i = 0; i < context_numBits; i++) {
                context_data_val = (context_data_val << 1) | (value & 1);
                if (context_data_position == 5) {
                  context_data_position = 0;
                  context_data.push(LZ._k.charAt(context_data_val));
                  context_data_val = 0;
                } else {
                  context_data_position++;
                }
                value = value >> 1;
              }
            }
            context_enlargeIn--;
            if (context_enlargeIn == 0) {
              context_enlargeIn = Math.pow(2, context_numBits);
              context_numBits++;
            }
            context_dictionary[context_wc] = context_dictSize++;
            context_w = String(context_c);
          }
        }

        if (context_w !== "") {
          if (Object.prototype.hasOwnProperty.call(context_dictionaryToCreate, context_w)) {
            if (context_w.charCodeAt(0) < 256) {
              for (i = 0; i < context_numBits; i++) {
                context_data_val = (context_data_val << 1);
                if (context_data_position == 5) {
                  context_data_position = 0;
                  context_data.push(LZ._k.charAt(context_data_val));
                  context_data_val = 0;
                } else {
                  context_data_position++;
                }
              }
              value = context_w.charCodeAt(0);
              for (i = 0; i < 8; i++) {
                context_data_val = (context_data_val << 1) | (value & 1);
                if (context_data_position == 5) {
                  context_data_position = 0;
                  context_data.push(LZ._k.charAt(context_data_val));
                  context_data_val = 0;
                } else {
                  context_data_position++;
                }
                value = value >> 1;
              }
            } else {
              value = 1;
              for (i = 0; i < context_numBits; i++) {
                context_data_val = (context_data_val << 1) | value;
                if (context_data_position == 5) {
                  context_data_position = 0;
                  context_data.push(LZ._k.charAt(context_data_val));
                  context_data_val = 0;
                } else {
                  context_data_position++;
                }
                value = 0;
              }
              value = context_w.charCodeAt(0);
              for (i = 0; i < 16; i++) {
                context_data_val = (context_data_val << 1) | (value & 1);
                if (context_data_position == 5) {
                  context_data_position = 0;
                  context_data.push(LZ._k.charAt(context_data_val));
                  context_data_val = 0;
                } else {
                  context_data_position++;
                }
                value = value >> 1;
              }
            }
            context_enlargeIn--;
            if (context_enlargeIn == 0) {
              context_enlargeIn = Math.pow(2, context_numBits);
              context_numBits++;
            }
            delete context_dictionaryToCreate[context_w];
          } else {
            value = context_dictionary[context_w];
            for (i = 0; i < context_numBits; i++) {
              context_data_val = (context_data_val << 1) | (value & 1);
              if (context_data_position == 5) {
                context_data_position = 0;
                context_data.push(LZ._k.charAt(context_data_val));
                context_data_val = 0;
              } else {
                context_data_position++;
              }
              value = value >> 1;
            }
          }
          context_enlargeIn--;
          if (context_enlargeIn == 0) {
            context_enlargeIn = Math.pow(2, context_numBits);
            context_numBits++;
          }
        }

        value = 2;
        for (i = 0; i < context_numBits; i++) {
          context_data_val = (context_data_val << 1) | (value & 1);
          if (context_data_position == 5) {
            context_data_position = 0;
            context_data.push(LZ._k.charAt(context_data_val));
            context_data_val = 0;
          } else {
            context_data_position++;
          }
          value = value >> 1;
        }

        while (true) {
          context_data_val = (context_data_val << 1);
          if (context_data_position == 5) {
            context_data.push(LZ._k.charAt(context_data_val));
            break;
          } else context_data_position++;
        }
        return context_data.join('');
      },
      decompress: function(input) {
        if (!input) return "";
        let dictionary = [],
            enlargeIn = 4,
            dictSize = 4,
            numBits = 3,
            entry = "",
            result = [],
            w,
            bits, resb, maxpower, power,
            c,
            data = { val: LZ._v(input.charAt(0)), position: 32, index: 1 };

        for (let i = 0; i < 3; i += 1) {
          dictionary[i] = i;
        }

        bits = 0;
        maxpower = Math.pow(2, 2);
        power = 1;
        while (power != maxpower) {
          resb = data.val & data.position;
          data.position >>= 1;
          if (data.position == 0) {
            data.position = 32;
            data.val = LZ._v(input.charAt(data.index++));
          }
          bits |= (resb > 0 ? 1 : 0) * power;
          power <<= 1;
        }

        switch (bits) {
          case 0:
            bits = 0;
            maxpower = Math.pow(2, 8);
            power = 1;
            while (power != maxpower) {
              resb = data.val & data.position;
              data.position >>= 1;
              if (data.position == 0) {
                data.position = 32;
                data.val = LZ._v(input.charAt(data.index++));
              }
              bits |= (resb > 0 ? 1 : 0) * power;
              power <<= 1;
            }
            c = String.fromCharCode(bits);
            break;
          case 1:
            bits = 0;
            maxpower = Math.pow(2, 16);
            power = 1;
            while (power != maxpower) {
              resb = data.val & data.position;
              data.position >>= 1;
              if (data.position == 0) {
                data.position = 32;
                data.val = LZ._v(input.charAt(data.index++));
              }
              bits |= (resb > 0 ? 1 : 0) * power;
              power <<= 1;
            }
            c = String.fromCharCode(bits);
            break;
          case 2:
            return "";
        }
        dictionary[3] = c;
        w = c;
        result.push(c);
        while (true) {
          if (data.index > input.length) return "";

          bits = 0;
          maxpower = Math.pow(2, numBits);
          power = 1;
          while (power != maxpower) {
            resb = data.val & data.position;
            data.position >>= 1;
            if (data.position == 0) {
              data.position = 32;
              data.val = LZ._v(input.charAt(data.index++));
            }
            bits |= (resb > 0 ? 1 : 0) * power;
            power <<= 1;
          }

          switch (c = bits) {
            case 0:
              bits = 0;
              maxpower = Math.pow(2, 8);
              power = 1;
              while (power != maxpower) {
                resb = data.val & data.position;
                data.position >>= 1;
                if (data.position == 0) {
                  data.position = 32;
                  data.val = LZ._v(input.charAt(data.index++));
                }
                bits |= (resb > 0 ? 1 : 0) * power;
                power <<= 1;
              }
              dictionary[dictSize++] = String.fromCharCode(bits);
              c = dictSize - 1;
              enlargeIn--;
              break;
            case 1:
              bits = 0;
              maxpower = Math.pow(2, 16);
              power = 1;
              while (power != maxpower) {
                resb = data.val & data.position;
                data.position >>= 1;
                if (data.position == 0) {
                  data.position = 32;
                  data.val = LZ._v(input.charAt(data.index++));
                }
                bits |= (resb > 0 ? 1 : 0) * power;
                power <<= 1;
              }
              dictionary[dictSize++] = String.fromCharCode(bits);
              c = dictSize - 1;
              enlargeIn--;
              break;
            case 2:
              return result.join('');
          }

          if (enlargeIn == 0) {
            enlargeIn = Math.pow(2, numBits);
            numBits++;
          }

          if (dictionary[c]) {
            entry = dictionary[c];
          } else {
            if (c === dictSize) {
              entry = w + w.charAt(0);
            } else {
              return null;
            }
          }
          result.push(entry);
          dictionary[dictSize++] = w + entry.charAt(0);
          enlargeIn--;
          w = entry;

          if (enlargeIn == 0) {
            enlargeIn = Math.pow(2, numBits);
            numBits++;
          }
        }
      },
      _v: function(char) {
        return LZ._k.indexOf(char);
      }
    };
  </script>

  <script>
    const STORAGE_KEY = 'parent_studio_apps';

    function openAppDatabase() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('AppStudioDB', 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('apps')) {
            db.createObjectStore('apps', { keyPath: 'id' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function getChildAppFromDB(id) {
      try {
        const db = await openAppDatabase();
        return new Promise((resolve) => {
          const tx = db.transaction('apps', 'readonly');
          const store = tx.objectStore('apps');
          const req = store.get(id);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch (e) {
        return null;
      }
    }

    async function persistAppGlobally(appData) {
      if (!appData || !appData.id) return;
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const apps = raw ? JSON.parse(raw) : {};
        apps[appData.id] = appData;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(apps));
      } catch (e) {}

      try {
        const db = await openAppDatabase();
        const tx = db.transaction('apps', 'readwrite');
        tx.objectStore('apps').put(appData);
      } catch (e) {}
    }

    /*
     * DUAL ROUTER:
     * Resolves app either from embedded URL hash (#d=...) or query parameter (?app=...).
     * This guarantees that when added to phone Home Screen, the app opens with 100% reliability.
     */
    (async function checkChildRoute() {
      const urlParams = new URLSearchParams(window.location.search);
      let targetId = urlParams.get('app');

      // Extract hash parameters
      let hashData = null;
      let hashId = null;
      if (window.location.hash) {
        const cleanHash = window.location.hash.replace(/^#/, '');
        const hashParams = new URLSearchParams(cleanHash);
        hashData = hashParams.get('d');
        hashId = hashParams.get('id') || hashParams.get('app');
      }

      if (!targetId && hashId) targetId = hashId;
      if (!targetId && !hashData) return; // Stay in Parent Studio

      // Hide parent layout instantly to avoid UI flickering
      const styleHide = document.createElement('style');
      styleHide.id = 'childAppPreloadStyle';
      styleHide.textContent = 'body > * { display: none !important; }';
      document.head.appendChild(styleHide);

      function renderWhenReady(callback) {
        if (document.readyState === 'interactive' || document.readyState === 'complete') {
          callback();
        } else {
          document.addEventListener('DOMContentLoaded', callback, { once: true });
        }
      }

      let childApp = null;

      // 1. First priority: Decompress embedded hash data (fixes isolated home screen containers)
      if (hashData) {
        try {
          const decompressed = LZ.decompress(hashData);
          if (decompressed) {
            childApp = JSON.parse(decompressed);
            // Cache immediately into this container's storage
            persistAppGlobally(childApp);
          }
        } catch (err) {
          console.warn("Hash decompression error:", err);
        }
      }

      // 2. Second priority: Local Storage
      if (!childApp && targetId) {
        try {
          const rawData = localStorage.getItem(STORAGE_KEY);
          const apps = rawData ? JSON.parse(rawData) : {};
          childApp = apps[targetId];
        } catch (e) {}
      }

      // 3. Third priority: IndexedDB
      if (!childApp && targetId) {
        childApp = await getChildAppFromDB(targetId);
      }

      // If app is not found
      if (!childApp) {
        renderWhenReady(() => {
          if (styleHide.parentNode) styleHide.parentNode.removeChild(styleHide);
          document.body.innerHTML = `
            <div class="min-h-screen bg-slate-50 text-slate-800 flex flex-col items-center justify-center p-6 text-center font-sans">
              <div class="bg-white border border-slate-200 p-8 rounded-2xl max-w-md shadow-sm">
                <div class="w-12 h-12 bg-amber-50 text-amber-500 rounded-xl flex items-center justify-center text-xl mx-auto mb-3">🔍</div>
                <h1 class="text-lg font-bold text-slate-900 mb-1">App Not Found</h1>
                <p class="text-slate-500 text-sm mb-5">Could not load this app. If you copied the link, make sure the complete URL was preserved.</p>
                <a href="${window.location.pathname}" class="inline-block px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium transition-colors">Return to Studio</a>
              </div>
            </div>
          `;
        });
        return;
      }

      document.title = childApp.title || "My App";
      const appBgColor = childApp.themeColor || '#0f172a';

      // Resolve icon
      const fallbackSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="${appBgColor}"/><text y=".9em" x="50%" text-anchor="middle" font-size="70">⚡</text></svg>`;
      const fallbackIcon = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(fallbackSvg)}`;
      let effectiveIcon = (childApp.iconUrl && childApp.iconUrl.trim()) ? childApp.iconUrl.trim() : fallbackIcon;
      if (effectiveIcon.startsWith('http://')) {
        effectiveIcon = effectiveIcon.replace('http://', 'https://');
      }

      // Apple Touch Icons for iOS Safari
      document.querySelectorAll('link[rel*="apple-touch-icon"]').forEach(el => el.remove());
      ['', '180x180', '152x152', '167x167', '120x120'].forEach(size => {
        const link = document.createElement('link');
        link.rel = 'apple-touch-icon';
        if (size) link.setAttribute('sizes', size);
        link.href = effectiveIcon;
        document.head.appendChild(link);
      });

      // Favicon
      let dynamicFavicon = document.querySelector('link[rel="icon"]');
      if (!dynamicFavicon) {
        dynamicFavicon = document.createElement('link');
        dynamicFavicon.rel = 'icon';
        document.head.appendChild(dynamicFavicon);
      }
      dynamicFavicon.href = effectiveIcon;

      // Dynamic Web App Manifest
      const manifestObj = {
        name: childApp.title,
        short_name: (childApp.title || "App").substring(0, 12),
        start_url: window.location.href,
        display: "standalone",
        orientation: "portrait-primary",
        background_color: appBgColor,
        theme_color: appBgColor,
        icons: [
          { src: effectiveIcon, sizes: "192x192", type: "image/png", purpose: "any" },
          { src: effectiveIcon, sizes: "512x512", type: "image/png", purpose: "any" },
          { src: effectiveIcon, sizes: "192x192", type: "image/png", purpose: "maskable" },
          { src: effectiveIcon, sizes: "512x512", type: "image/png", purpose: "maskable" }
        ]
      };

      const manifestDataUri = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifestObj));
      let manifestLink = document.querySelector('link[rel="manifest"]');
      if (!manifestLink) {
        manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        document.head.appendChild(manifestLink);
      }
      manifestLink.href = manifestDataUri;

      // Meta tags for mobile status bar
      const themeMeta = document.getElementById('dynamicThemeColor') || document.querySelector('meta[name="theme-color"]');
      if (themeMeta) themeMeta.content = appBgColor;

      let metaCapable = document.querySelector('meta[name="apple-mobile-web-app-capable"]');
      if (!metaCapable) {
        metaCapable = document.createElement('meta');
        metaCapable.name = "apple-mobile-web-app-capable";
        metaCapable.content = "yes";
        document.head.appendChild(metaCapable);
      }

      let metaBar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
      if (!metaBar) {
        metaBar = document.createElement('meta');
        metaBar.name = "apple-mobile-web-app-status-bar-style";
        metaBar.content = "black-translucent";
        document.head.appendChild(metaBar);
      }

      let metaTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
      if (!metaTitle) {
        metaTitle = document.createElement('meta');
        metaTitle.name = "apple-mobile-web-app-title";
        document.head.appendChild(metaTitle);
      }
      metaTitle.content = childApp.title;

      renderWhenReady(() => {
        if (styleHide.parentNode) styleHide.parentNode.removeChild(styleHide);

        document.body.style.margin = "0";
        document.body.style.padding = "0";
        document.body.style.overflow = "hidden";
        document.body.style.width = "100vw";
        document.body.style.height = "100vh";
        document.body.style.background = appBgColor;

        const frame = document.createElement('iframe');
        frame.style.width = "100vw";
        frame.style.height = "100vh";
        frame.style.border = "none";
        frame.style.display = "block";
        frame.style.background = appBgColor;
        frame.setAttribute('allow', 'fullscreen; geolocation; microphone; camera; midi');

        try {
          const blob = new Blob([childApp.code], { type: 'text/html;charset=utf-8' });
          frame.src = URL.createObjectURL(blob);
        } catch (e) {
          frame.srcdoc = childApp.code;
        }

        document.body.innerHTML = '';
        document.body.appendChild(frame);
      });
    })();
  </script>

      <!-- Inputs: App Name, Hosted Image URL & Splash Color -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">App Name</label>
          <input type="text" id="inputTitle" placeholder="Enter app name" class="w-full bg-white border border-slate-300 focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 rounded-lg px-3 py-2 text-sm text-slate-900 placeholder-slate-400 outline-none transition-all">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Hosted Image URL</label>
          <div class="flex items-center gap-2">
            <input type="url" id="inputIconUrl" placeholder="https://example.com/icon.png" class="flex-1 bg-white border border-slate-300 focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 rounded-lg px-3 py-2 text-sm text-slate-900 placeholder-slate-400 outline-none transition-all">
            <div id="iconPreviewBox" class="w-9 h-9 rounded-lg border border-slate-200 bg-slate-100 flex items-center justify-center overflow-hidden shrink-0">
              <span id="iconPreviewPlaceholder" class="text-xs text-slate-400">🖼️</span>
              <img id="iconPreviewImg" src="" alt="Icon" class="w-full h-full object-cover hidden">
            </div>
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Splash / BG Color</label>
          <div class="flex items-center gap-2">
            <input type="color" id="inputColorPicker" value="#0f172a" class="w-9 h-9 p-0.5 rounded-lg border border-slate-300 bg-white cursor-pointer shrink-0">
            <input type="text" id="inputThemeColor" value="#0f172a" placeholder="#0f172a" class="w-full bg-white border border-slate-300 focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 rounded-lg px-3 py-2 text-sm text-slate-900 font-mono outline-none transition-all">
          </div>
        </div>
      </div>

      <!-- HTML Code Area -->
      <div class="mb-5">
        <label for="inputCode" class="block text-xs font-medium text-slate-700 mb-1">HTML / CSS / JS Code</label>
        <textarea id="inputCode" rows="15" placeholder="Paste full HTML code here..." class="w-full bg-slate-900 text-slate-100 border border-slate-800 rounded-lg p-3 text-xs sm:text-sm font-mono placeholder-slate-500 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none resize-y leading-relaxed transition-all"></textarea>
      </div>

      <!-- Action Button -->
      <div class="flex items-center justify-end pt-1">
        <button id="btnCreateApp" class="w-full sm:w-auto px-6 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-medium text-sm shadow-sm transition-all flex items-center justify-center gap-2">
          <span>Create App</span>
          <span>⚡</span>
        </button>
      </div>
    </div>
  </main>

  <div id="modalOverlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white border border-slate-200 rounded-2xl p-6 max-w-sm w-full shadow-xl text-center flex flex-col items-center animate-in fade-in zoom-in-95 duration-150">
      <div id="modalIconContainer" class="w-16 h-16 rounded-2xl bg-indigo-50 border border-indigo-100 flex items-center justify-center overflow-hidden mb-4 shadow-sm">
        <img id="modalIconImg" src="" alt="App Icon" class="w-full h-full object-cover hidden">
        <span id="modalIconFallback" class="text-2xl">⚡</span>
      </div>
      <h3 id="modalAppTitle" class="text-lg font-bold text-slate-900 mb-1">App Ready</h3>
      <p class="text-xs text-slate-500 mb-5">Your standalone app link has been created and encoded.</p>
      
      <div class="flex flex-col w-full gap-2">
        <a id="btnModalOpen" target="_blank" href="#" class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm transition-all shadow-sm flex items-center justify-center gap-2">
          Open the App
        </a>
        <button id="btnModalOpenSameTab" class="w-full py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-xs transition-all">
          Launch in Current Tab
        </button>
        <button id="btnModalCopyLink" class="w-full py-2 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-700 font-medium text-xs transition-all flex items-center justify-center gap-1.5">
          <span>📋</span>
          <span>Copy App Link</span>
        </button>
        <button id="btnModalClose" class="w-full py-2 rounded-xl text-slate-500 hover:text-slate-700 text-xs transition-all">
          Close
        </button>
      </div>
    </div>
  </div>

  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none bg-slate-900 text-white text-xs sm:text-sm px-4 py-2.5 rounded-lg shadow-lg flex items-center gap-2">
    <span id="toastIcon">✨</span>
    <span id="toastMsg">Operation successful</span>
  </div>

  <script>
    // DOM Elements
    const inputTitle = document.getElementById('inputTitle');
    const inputIconUrl = document.getElementById('inputIconUrl');
    const iconPreviewImg = document.getElementById('iconPreviewImg');
    const iconPreviewPlaceholder = document.getElementById('iconPreviewPlaceholder');
    const inputColorPicker = document.getElementById('inputColorPicker');
    const inputThemeColor = document.getElementById('inputThemeColor');
    const inputCode = document.getElementById('inputCode');
    const btnCreateApp = document.getElementById('btnCreateApp');
    const btnClearForm = document.getElementById('btnClearForm');

    // Modal Elements
    const modalOverlay = document.getElementById('modalOverlay');
    const modalAppTitle = document.getElementById('modalAppTitle');
    const modalIconImg = document.getElementById('modalIconImg');
    const modalIconFallback = document.getElementById('modalIconFallback');
    const btnModalOpen = document.getElementById('btnModalOpen');
    const btnModalOpenSameTab = document.getElementById('btnModalOpenSameTab');
    const btnModalCopyLink = document.getElementById('btnModalCopyLink');
    const btnModalClose = document.getElementById('btnModalClose');

    let currentGeneratedUrl = '';

    // Color synchronization
    inputColorPicker.addEventListener('input', () => {
      inputThemeColor.value = inputColorPicker.value;
    });

    inputThemeColor.addEventListener('input', () => {
      const val = inputThemeColor.value.trim();
      if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
        inputColorPicker.value = val;
      }
    });

    // Live update icon preview
    inputIconUrl.addEventListener('input', () => {
      let url = inputIconUrl.value.trim();
      if (url.startsWith('http://')) {
        url = url.replace('http://', 'https://');
      }
      if (url) {
        iconPreviewImg.src = url;
        iconPreviewImg.onload = () => {
          iconPreviewImg.classList.remove('hidden');
          iconPreviewPlaceholder.classList.add('hidden');
        };
        iconPreviewImg.onerror = () => {
          iconPreviewImg.classList.add('hidden');
          iconPreviewPlaceholder.classList.remove('hidden');
        };
      } else {
        iconPreviewImg.src = '';
        iconPreviewImg.classList.add('hidden');
        iconPreviewPlaceholder.classList.remove('hidden');
      }
    });

    // Toast notification helper
    function showToast(message, icon = '✨') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');
      toastMsg.innerText = message;
      toastIcon.innerText = icon;
      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 2400);
    }

    btnClearForm.addEventListener('click', () => {
      inputTitle.value = '';
      inputIconUrl.value = '';
      iconPreviewImg.src = '';
      iconPreviewImg.classList.add('hidden');
      iconPreviewPlaceholder.classList.remove('hidden');
      inputThemeColor.value = '#0f172a';
      inputColorPicker.value = '#0f172a';
      inputCode.value = '';
      inputTitle.focus();
    });

    btnModalClose.addEventListener('click', () => {
      modalOverlay.classList.add('hidden');
    });

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) {
        modalOverlay.classList.add('hidden');
      }
    });

    btnModalOpenSameTab.addEventListener('click', () => {
      if (currentGeneratedUrl) {
        window.location.href = currentGeneratedUrl;
      }
    });

    btnModalCopyLink.addEventListener('click', () => {
      if (!currentGeneratedUrl) return;
      const dummy = document.createElement('textarea');
      dummy.value = currentGeneratedUrl;
      document.body.appendChild(dummy);
      dummy.select();
      try {
        document.execCommand('copy');
        showToast('Link copied to clipboard!', '📋');
      } catch (err) {
        showToast('Failed to copy', '⚠️');
      }
      document.body.removeChild(dummy);
    });

    function getNormalizedBasePath() {
      let path = window.location.pathname;
      if (!path.endsWith('/') && !path.split('/').pop().includes('.')) {
        path += '/';
      }
      return `${window.location.origin}${path}`;
    }

    btnCreateApp.addEventListener('click', async () => {
      const title = inputTitle.value.trim();
      let iconUrl = inputIconUrl.value.trim();
      const themeColor = inputThemeColor.value.trim() || '#0f172a';
      const code = inputCode.value;

      if (!title) {
        showToast('Please enter an App Name', '⚠️');
        inputTitle.focus();
        return;
      }

      if (!code.trim()) {
        showToast('Code cannot be empty', '⚠️');
        inputCode.focus();
        return;
      }

      if (iconUrl.startsWith('http://')) {
        iconUrl = iconUrl.replace('http://', 'https://');
      }

      // Generate clean slug ID
      const id = title.toLowerCase().replace(/[^a-z0-9_-]/g, '-').replace(/-+/g, '-') || 'app-' + Date.now();
      const appData = { id, title, iconUrl, themeColor, code, updatedAt: Date.now() };

      // 1. Save locally to both localStorage and IndexedDB
      await persistAppGlobally(appData);

      // 2. Compress payload into safe hash string
      const jsonString = JSON.stringify(appData);
      const compressedData = LZ.compress(jsonString);

      // 3. Construct URL: Short query (?app=) keeps GitHub Pages happy, while hash (#d=) carries the full code
      const base = getNormalizedBasePath();
      currentGeneratedUrl = `${base}?app=${encodeURIComponent(id)}#d=${compressedData}`;

      // Update and display launch modal
      modalAppTitle.innerText = title;
      btnModalOpen.href = currentGeneratedUrl;

      if (iconUrl) {
        modalIconImg.src = iconUrl;
        modalIconImg.classList.remove('hidden');
        modalIconFallback.classList.add('hidden');
      } else {
        modalIconImg.classList.add('hidden');
        modalIconFallback.classList.remove('hidden');
      }

      modalOverlay.classList.remove('hidden');
    });
  </script>
</body>
</html>
