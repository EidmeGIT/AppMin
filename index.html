<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>App Studio</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Font: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <meta id="theme-color-meta" name="theme-color" content="#ffffff">
  <link id="apple-touch-icon-link" rel="apple-touch-icon" href="">
  <link id="favicon-link" rel="icon" href="">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    };
  </script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
    #child-frame {
      display: none;
      width: 100vw;
      height: 100vh;
      border: none;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 99999;
    }
  </style>

  <script>
    // Turso Cloud Database Configuration
    const TURSO_ENDPOINT = "https://websitexd-eidmeturso.aws-ap-south-1.turso.io/v2/pipeline";
    const TURSO_TOKEN = "eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicnciLCJpYXQiOjE3OTA1ODA2MzgsImlkIjoiMDFhMGU2ZWMtMmMwMS03ZDAyLThkMjItZjllMzk2MWJhZjczIiwia2lkIjoicm9ENkhSd1RGUUJnSS1iVG83SjlGaUV4SzlnaWtkVDBzX1pLSzRlVEdhQSIsInJpZCI6IjFiN2E2ZTAzLTM1NGUtNDZmNy1iMzI5LTQyMmY4M2JjMjU1MCJ9.vCPP5iXuYoUwsEGj8wmYiQA9MRFR0f3suvuAP6mycibbEgypXXI1BbLTbXxPjNeaY-8kp8jVHhqpq6SoqRilDQ";

    // Helper to query Turso HTTP Pipeline
    async function queryTurso(sql, args = []) {
      const formattedArgs = args.map(val => {
        if (val === null || val === undefined) return { type: "null" };
        // Turso's Hrana v2 protocol requires 64-bit integers to be encoded as string values
        if (typeof val === "number") return { type: "integer", value: String(Math.floor(val)) };
        return { type: "text", value: String(val) };
      });

      const response = await fetch(TURSO_ENDPOINT, {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${TURSO_TOKEN}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          requests: [
            {
              type: "execute",
              stmt: {
                sql: sql,
                args: formattedArgs
              }
            },
            { type: "close" }
          ]
        })
      });

      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(`Turso connection failed: ${response.status} ${errorText}`);
      }

      const data = await response.json();
      const firstResult = data.results && data.results[0];
      if (firstResult && firstResult.type === "error") {
        throw new Error(firstResult.error ? firstResult.error.message : "Database error");
      }
      return firstResult && firstResult.response ? firstResult.response.result : null;
    }

    // Auto-create apps table in Turso on launch
    async function ensureTableExists() {
      try {
        await queryTurso(`
          CREATE TABLE IF NOT EXISTS apps (
            id TEXT PRIMARY KEY,
            name TEXT NOT NULL,
            icon TEXT,
            color TEXT,
            code TEXT NOT NULL,
            created_at INTEGER
          );
        `);
      } catch (err) {
        console.warn("Could not verify Turso table:", err);
      }
    }
    ensureTableExists();

    (async function checkChildRoute() {
      const urlParams = new URLSearchParams(window.location.search);
      let targetId = urlParams.get('app');

      if (!targetId && window.location.hash) {
        const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
        targetId = hashParams.get('app') || hashParams.get('id');
      }

      if (!targetId) return; // Stay in parent studio mode

      // Fast layout hiding while retrieving app code
      const preHideStyle = document.createElement('style');
      preHideStyle.id = 'preHideStyle';
      preHideStyle.textContent = '#parent-studio-ui { display: none !important; }';
      document.head.appendChild(preHideStyle);

      function mountWhenReady(callback) {
        if (document.readyState === 'interactive' || document.readyState === 'complete') {
          callback();
        } else {
          document.addEventListener('DOMContentLoaded', callback, { once: true });
        }
      }

      try {
        // Fetch app from Turso DB
        const result = await queryTurso("SELECT name, icon, color, code FROM apps WHERE id = ? LIMIT 1;", [targetId]);
        
        if (!result || !result.rows || result.rows.length === 0) {
          throw new Error("App not found in cloud database.");
        }

        const row = result.rows[0];
        const app = {
          name: row[0]?.value || "My App",
          icon: row[1]?.value || "",
          color: row[2]?.value || "#0f172a",
          code: row[3]?.value || ""
        };

        // Update Document Title
        document.title = app.name;

        // Apply Splash / BG Theme Color
        const themeMeta = document.getElementById('theme-color-meta');
        if (themeMeta) themeMeta.setAttribute('content', app.color);
        document.documentElement.style.backgroundColor = app.color;
        document.body.style.backgroundColor = app.color;

        // Apply Apple Touch Icon & Favicon
        const fallbackSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="${app.color}"/><text y=".9em" x="50%" text-anchor="middle" font-size="70">⚡</text></svg>`;
        const fallbackIcon = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(fallbackSvg)}`;
        let effectiveIcon = (app.icon && app.icon.trim()) ? app.icon.trim() : fallbackIcon;

        const appleIconLink = document.getElementById('apple-touch-icon-link');
        if (appleIconLink) appleIconLink.href = effectiveIcon;

        const faviconLink = document.getElementById('favicon-link');
        if (faviconLink) faviconLink.href = effectiveIcon;

        // Render child app into isolated viewport
        mountWhenReady(() => {
          const parentUi = document.getElementById('parent-studio-ui');
          if (parentUi) parentUi.remove();

          const frame = document.getElementById('child-frame');
          frame.style.display = 'block';
          frame.style.backgroundColor = app.color;
          frame.setAttribute('allow', 'fullscreen; geolocation; microphone; camera; midi');

          try {
            const blob = new Blob([app.code], { type: 'text/html;charset=utf-8' });
            frame.src = URL.createObjectURL(blob);
          } catch (e) {
            frame.srcdoc = app.code;
          }
        });

      } catch (err) {
        console.error("Child app loading error:", err);
        mountWhenReady(() => {
          if (preHideStyle.parentNode) preHideStyle.parentNode.removeChild(preHideStyle);
          document.body.innerHTML = `
            <div class="min-h-screen bg-slate-50 text-slate-800 flex flex-col items-center justify-center p-6 text-center font-sans">
              <div class="bg-white border border-slate-200 p-8 rounded-2xl max-w-sm w-full shadow-sm">
                <div class="w-12 h-12 bg-amber-50 text-amber-500 rounded-xl flex items-center justify-center text-xl mx-auto mb-3">🔍</div>
                <h1 class="text-base font-bold text-slate-900 mb-1">App Not Found</h1>
                <p class="text-slate-500 text-xs mb-5">Could not retrieve this app from Turso cloud storage. Check your link or return to the studio.</p>
                <a href="${window.location.origin + window.location.pathname}" class="inline-block w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-semibold transition-colors">Return to Studio</a>
              </div>
            </div>
          `;
        });
      }
    })();
  </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans selection:bg-indigo-100 selection:text-indigo-900 flex flex-col">

  <!-- Child App Standalone Fullscreen Viewport -->
  <iframe id="child-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>

  <!-- Main Parent Studio UI -->
  <div id="parent-studio-ui" class="flex-1 flex flex-col">
    <!-- Header -->
    <header class="border-b border-slate-200 bg-white sticky top-0 z-30">
      <div class="max-w-3xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white text-sm shadow-sm">
            ⚡
          </div>
          <div>
            <h1 class="text-sm font-semibold text-slate-900 flex items-center gap-2">
              App Studio
              <span class="text-[10px] font-mono font-medium bg-emerald-50 text-emerald-700 border border-emerald-200 px-1.5 py-0.5 rounded">Turso Cloud Active</span>
            </h1>
          </div>
        </div>

        <button id="btnClear" type="button" class="px-3 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-xs transition-all">
          Clear
        </button>
      </div>
    </header>

    <!-- Main Creator Form -->
    <main class="max-w-3xl w-full mx-auto p-4 sm:p-6 flex-1 flex flex-col justify-start">
      <div class="bg-white border border-slate-200 rounded-2xl p-5 sm:p-6 shadow-sm">
        
        <!-- App Details Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">App Name</label>
            <input type="text" id="inputTitle" placeholder="e.g. Speed Converter" class="w-full bg-white border border-slate-300 focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 rounded-xl px-3 py-2 text-sm text-slate-900 placeholder-slate-400 outline-none transition-all">
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Hosted Image URL</label>
            <div class="flex items-center gap-2">
              <input type="url" id="inputIconUrl" placeholder="https://example.com/icon.png" class="flex-1 bg-white border border-slate-300 focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 rounded-xl px-3 py-2 text-sm text-slate-900 placeholder-slate-400 outline-none transition-all">
              <div id="iconPreviewBox" class="w-9 h-9 rounded-lg border border-slate-200 bg-slate-100 flex items-center justify-center overflow-hidden shrink-0">
                <span id="iconPreviewPlaceholder" class="text-xs text-slate-400">🖼️</span>
                <img id="iconPreviewImg" src="" alt="Icon" class="w-full h-full object-cover hidden">
              </div>
            </div>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Splash / BG Color</label>
            <div class="flex items-center gap-2">
              <input type="color" id="inputColorPicker" value="#0f172a" class="w-9 h-9 p-0.5 rounded-lg border border-slate-300 bg-white cursor-pointer shrink-0">
              <input type="text" id="inputThemeColor" value="#0f172a" placeholder="#0f172a" class="w-full bg-white border border-slate-300 focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 rounded-xl px-3 py-2 text-sm text-slate-900 font-mono outline-none transition-all">
            </div>
          </div>
        </div>

        <!-- HTML Code Editor Textarea -->
        <div class="mb-5">
          <label for="inputCode" class="block text-xs font-medium text-slate-700 mb-1">HTML / CSS / JS Code</label>
          <textarea id="inputCode" rows="15" placeholder="Paste full HTML code here..." class="w-full bg-slate-900 text-slate-100 border border-slate-800 rounded-xl p-3.5 text-xs sm:text-sm font-mono placeholder-slate-500 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none resize-y leading-relaxed transition-all"></textarea>
        </div>

        <!-- Submit Button -->
        <div class="flex items-center justify-end">
          <button id="btnCreateApp" class="w-full sm:w-auto px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-semibold text-sm shadow-sm transition-all flex items-center justify-center gap-2">
            <span id="btnCreateText">Create App</span>
            <span id="btnCreateSpinner" class="hidden animate-spin">⏳</span>
          </button>
        </div>
      </div>
    </main>
  </div>

  <div id="modalOverlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white border border-slate-200 rounded-2xl p-6 max-w-sm w-full shadow-xl text-center flex flex-col items-center animate-in fade-in zoom-in-95 duration-150">
      <div id="modalIconContainer" class="w-16 h-16 rounded-2xl bg-indigo-50 border border-indigo-100 flex items-center justify-center overflow-hidden mb-3 shadow-sm">
        <img id="modalIconImg" src="" alt="App Icon" class="w-full h-full object-cover hidden">
        <span id="modalIconFallback" class="text-2xl">⚡</span>
      </div>
      
      <h3 id="modalAppTitle" class="text-base font-bold text-slate-900 mb-1">App Ready</h3>
      <p class="text-xs text-slate-500 mb-5">Saved to Turso Cloud. Clean URL is ready to launch or add to your home screen.</p>
      
      <div class="flex flex-col w-full gap-2">
        <a id="btnModalOpen" target="_blank" href="#" class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs sm:text-sm transition-all shadow-sm flex items-center justify-center gap-1.5">
          <span>Open the App</span>
          <span>↗</span>
        </a>
        <button id="btnModalCopyLink" class="w-full py-2 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-700 font-medium text-xs transition-all flex items-center justify-center gap-1.5">
          <span>📋</span>
          <span>Copy App Link</span>
        </button>
        <button id="btnModalClose" class="w-full py-2 rounded-xl text-slate-500 hover:text-slate-700 text-xs transition-all">
          Close
        </button>
      </div>
    </div>
  </div>

  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none bg-slate-900 text-white text-xs sm:text-sm px-4 py-2.5 rounded-xl shadow-lg flex items-center gap-2">
    <span id="toastIcon">✨</span>
    <span id="toastMsg">Notification message</span>
  </div>

  <script>
    // DOM Elements
    const inputTitle = document.getElementById('inputTitle');
    const inputIconUrl = document.getElementById('inputIconUrl');
    const iconPreviewImg = document.getElementById('iconPreviewImg');
    const iconPreviewPlaceholder = document.getElementById('iconPreviewPlaceholder');
    const inputColorPicker = document.getElementById('inputColorPicker');
    const inputThemeColor = document.getElementById('inputThemeColor');
    const inputCode = document.getElementById('inputCode');
    const btnCreateApp = document.getElementById('btnCreateApp');
    const btnCreateText = document.getElementById('btnCreateText');
    const btnCreateSpinner = document.getElementById('btnCreateSpinner');
    const btnClear = document.getElementById('btnClear');

    // Modal Elements
    const modalOverlay = document.getElementById('modalOverlay');
    const modalAppTitle = document.getElementById('modalAppTitle');
    const modalIconImg = document.getElementById('modalIconImg');
    const modalIconFallback = document.getElementById('modalIconFallback');
    const btnModalOpen = document.getElementById('btnModalOpen');
    const btnModalCopyLink = document.getElementById('btnModalCopyLink');
    const btnModalClose = document.getElementById('btnModalClose');

    let currentGeneratedUrl = '';

    // Color Pickers Synchronization
    inputColorPicker.addEventListener('input', () => {
      inputThemeColor.value = inputColorPicker.value;
    });

    inputThemeColor.addEventListener('input', () => {
      const val = inputThemeColor.value.trim();
      if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
        inputColorPicker.value = val;
      }
    });

    // Live Thumbnail Preview for Hosted Image URL
    inputIconUrl.addEventListener('input', () => {
      let url = inputIconUrl.value.trim();
      if (url.startsWith('http://')) {
        url = url.replace('http://', 'https://');
      }
      if (url) {
        iconPreviewImg.src = url;
        iconPreviewImg.onload = () => {
          iconPreviewImg.classList.remove('hidden');
          iconPreviewPlaceholder.classList.add('hidden');
        };
        iconPreviewImg.onerror = () => {
          iconPreviewImg.classList.add('hidden');
          iconPreviewPlaceholder.classList.remove('hidden');
        };
      } else {
        iconPreviewImg.src = '';
        iconPreviewImg.classList.add('hidden');
        iconPreviewPlaceholder.classList.remove('hidden');
      }
    });

    // Custom Toast Notification
    function showToast(message, icon = '✨') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');
      toastMsg.innerText = message;
      toastIcon.innerText = icon;
      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 2500);
    }

    // Clear form
    btnClear.addEventListener('click', () => {
      inputTitle.value = '';
      inputIconUrl.value = '';
      iconPreviewImg.src = '';
      iconPreviewImg.classList.add('hidden');
      iconPreviewPlaceholder.classList.remove('hidden');
      inputThemeColor.value = '#0f172a';
      inputColorPicker.value = '#0f172a';
      inputCode.value = '';
      inputTitle.focus();
    });

    // Modal Events
    btnModalClose.addEventListener('click', () => {
      modalOverlay.classList.add('hidden');
    });

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) modalOverlay.classList.add('hidden');
    });

    btnModalCopyLink.addEventListener('click', () => {
      if (!currentGeneratedUrl) return;
      const dummy = document.createElement('textarea');
      dummy.value = currentGeneratedUrl;
      document.body.appendChild(dummy);
      dummy.select();
      try {
        document.execCommand('copy');
        showToast('Link copied to clipboard!', '📋');
      } catch (err) {
        showToast('Failed to copy', '⚠️');
      }
      document.body.removeChild(dummy);
    });

    function getNormalizedBasePath() {
      let path = window.location.pathname;
      if (!path.endsWith('/') && !path.split('/').pop().includes('.')) {
        path += '/';
      }
      return `${window.location.origin}${path}`;
    }

    btnCreateApp.addEventListener('click', async () => {
      const title = inputTitle.value.trim();
      let iconUrl = inputIconUrl.value.trim();
      const themeColor = inputThemeColor.value.trim() || '#0f172a';
      const code = inputCode.value;

      if (!title) {
        showToast('Please enter an App Name', '⚠️');
        inputTitle.focus();
        return;
      }

      if (!code.trim()) {
        showToast('Code cannot be empty', '⚠️');
        inputCode.focus();
        return;
      }

      if (iconUrl.startsWith('http://')) {
        iconUrl = iconUrl.replace('http://', 'https://');
      }

      // Generate a clean slug ID
      const baseSlug = title.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '') || 'app';
      const randomSuffix = Math.random().toString(36).substring(2, 6);
      const appId = `${baseSlug}-${randomSuffix}`;

      // Show loading state
      btnCreateApp.disabled = true;
      btnCreateText.textContent = "Saving to Turso...";
      btnCreateSpinner.classList.remove('hidden');

      try {
        // Ensure table exists & Insert app data directly into Turso
        await ensureTableExists();
        await queryTurso(
          `INSERT OR REPLACE INTO apps (id, name, icon, color, code, created_at) VALUES (?, ?, ?, ?, ?, ?);`,
          [appId, title, iconUrl, themeColor, code, Date.now()]
        );

        // Construct short, clean URL (safe for iOS, Android, and GitHub Pages)
        const base = getNormalizedBasePath();
        currentGeneratedUrl = `${base}?app=${encodeURIComponent(appId)}`;

        // Configure Modal
        modalAppTitle.innerText = title;
        btnModalOpen.href = currentGeneratedUrl;

        if (iconUrl) {
          modalIconImg.src = iconUrl;
          modalIconImg.classList.remove('hidden');
          modalIconFallback.classList.add('hidden');
        } else {
          modalIconImg.classList.add('hidden');
          modalIconFallback.classList.remove('hidden');
        }

        // Open ready popup
        modalOverlay.classList.remove('hidden');
        showToast('Saved to Turso Database!', '🚀');

      } catch (err) {
        console.error("Save error:", err);
        showToast(`Failed: ${err.message}`, '⚠️');
      } finally {
        btnCreateApp.disabled = false;
        btnCreateText.textContent = "Create App";
        btnCreateSpinner.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
